<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png.png">
  <title>LowerBlock | Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #102d50, #07131f 45%, #03080d);
      color: #fff;
      font: 1rem/1.5 Arial, Helvetica, sans-serif;
    }
    header { background: #050c14; border-bottom: 2px solid #198cff; }
    header a {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(92%, 720px);
      margin: auto;
      padding: 14px 0;
      color: white;
      font-size: 1.35rem;
      font-weight: bold;
      text-decoration: none;
    }
    header img { width: 48px; height: 48px; object-fit: contain; }
    main { width: min(92%, 720px); margin: 42px auto; }
    a, #price { color: #69c1ff; }
    h1 { margin: 15px 0; }
    h2, p { margin: 0; }
    .card { padding: 24px; background: #091723; border: 1px solid #21425a; border-radius: 13px; }
    .product { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
    .product img { width: 80px; height: 80px; object-fit: contain; }
    #price { display: block; margin-top: 8px; font-size: 1.25rem; }
    label { display: block; font-weight: bold; }
    input, button { width: 100%; padding: 12px; border-radius: 7px; font: inherit; }
    input { margin: 8px 0 16px; background: #06111b; color: white; border: 1px solid #55748c; }
    button { border: 0; background: #69c1ff; color: #07131f; font-weight: bold; cursor: pointer; }
    fieldset { margin: 0 0 18px; padding: 16px; border: 1px solid #55748c; border-radius: 7px; }
    legend { padding: 0 6px; font-weight: bold; }
    .card-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    input::placeholder { color: #adc5d8; opacity: 1; }
    input:focus::placeholder { color: transparent; }
    dialog { width: min(92%, 420px); color: white; }
    dialog::backdrop { background: #03080dcc; }
    dialog h2 { margin-bottom: 16px; }
    .dialog-actions { display: flex; gap: 12px; }
    .secondary { background: #263746; color: white; }
    .note { color: #adc5d8; margin-bottom: 18px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" id="brand"><img src="lowerblock-logo.png (2).png" alt=""> LOWERBLOCK</a>
  </header>
  <main>
    <h1>Checkout Page</h1>
    <p id="loading" role="status">Loading your item…</p>
    <noscript>Enable JavaScript to load your selection.</noscript>
    <section class="card" id="order" hidden aria-label="Order details">
      <div class="product">
        <img id="image" alt="" hidden>
        <div>
          <h2 id="item"></h2>
          <p id="description"></p>
          <strong id="price"></strong>
        </div>
      </div>
      <form id="preview">
        <label for="username">Minecraft username</label>
        <input id="username" required minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}"
          title="Use 3–16 letters, numbers, or underscores." autocapitalize="off" spellcheck="false">
        <fieldset>
          <legend>Practice payment details</legend>
          <p class="note">Use made-up details only.</p>
          <label for="test-email">Email</label>
          <input id="test-email" required type="email" placeholder="name@example.com" autocomplete="off">
          <label for="test-name">Name on card</label>
          <input id="test-name" required pattern=".*\S.*" placeholder="Full Name" autocomplete="off">
          <label for="test-card">Card number</label>
          <input id="test-card" required inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" autocomplete="off">
          <div class="card-fields">
            <div>
              <label for="test-expiry">Expiration</label>
              <input id="test-expiry" required inputmode="numeric" maxlength="7" placeholder="MM/YY" autocomplete="off">
            </div>
            <div>
              <label for="test-cvc">Security code</label>
              <input id="test-cvc" required inputmode="numeric" maxlength="4" placeholder="000" autocomplete="off">
            </div>
          </div>
          <label for="test-zip">Billing ZIP code</label>
          <input id="test-zip" required inputmode="numeric" maxlength="10" placeholder="00000" autocomplete="off">
        </fieldset>
        <button type="submit">Complete Checkout</button>
      </form>
    </section>
  </main>
  <dialog class="card" id="leave-dialog" aria-labelledby="leave-title">
    <h2 id="leave-title">Are You Sure You Want To Leave The Check Out Page?</h2>
    <form method="dialog" class="dialog-actions">
      <button class="secondary" value="leave">Leave</button>
      <button value="cancel" autofocus>Cancel</button>
    </form>
  </dialog>
  <dialog class="card" id="thanks-dialog" aria-labelledby="thanks-title">
    <h2 id="thanks-title"></h2>
    <form method="dialog"><button autofocus>Return to Store</button></form>
  </dialog>
  <script>
    const itemId = new URLSearchParams(location.search).get("item");
    const loading = document.querySelector("#loading");
    const username = document.querySelector("#username");
    const brand = document.querySelector("#brand");
    const leaveDialog = document.querySelector("#leave-dialog");
    const thanksDialog = document.querySelector("#thanks-dialog");

    thanksDialog.addEventListener("close", () => location.assign("store.html"));

    brand.addEventListener("click", (event) => {
      event.preventDefault();
      leaveDialog.returnValue = "cancel";
      leaveDialog.showModal();
    });

    leaveDialog.addEventListener("close", () => {
      if (leaveDialog.returnValue === "leave") location.assign(brand.href);
    });

    async function loadOrder() {
      if (!itemId || !/^[a-z0-9-]+$/.test(itemId)) {
        loading.textContent = "Choose an item from the store to continue.";
        return;
      }

      const response = await fetch("store.html");
      if (!response.ok) throw new Error("Store unavailable");

      // Use the store cards as the source for product names, prices and artwork.
      const store = new DOMParser().parseFromString(await response.text(), "text/html");
      const buyLink = store.querySelector(`.buy[href="checkout.html?item=${itemId}"]`);
      if (!buyLink) {
        loading.textContent = "This item is unavailable. Please choose an item from the store.";
        return;
      }

      const product = buyLink.closest(".product");
      const name = product.querySelector("h3").textContent.trim();
      document.querySelector("#item").textContent = name;
      document.querySelector("#description").textContent = product.querySelector("p").textContent.trim();
      document.querySelector("#price").textContent = product.querySelector(".price").textContent.trim();

      const image = document.querySelector("#image");
      image.addEventListener("load", () => { image.hidden = false; });
      image.src = product.querySelector("img").getAttribute("src");

      try {
        const savedUsername = localStorage.getItem("lowerblockMinecraftUsername");
        if (/^[A-Za-z0-9_]{3,16}$/.test(savedUsername ?? "")) username.value = savedUsername;
      } catch {
        // Checkout can still accept a manually entered username when storage is blocked.
      }

      document.querySelector("#preview").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#thanks-title").textContent =
          `Thank You ${username.value}, Your Support Is Appreciated!`;
        event.currentTarget.querySelector("fieldset").querySelectorAll("input").forEach((input) => {
          input.value = "";
        });
        thanksDialog.showModal();
      });
      loading.hidden = true;
      document.querySelector("#order").hidden = false;
    }

    loadOrder().catch(() => {
      loading.textContent = "Couldn’t load checkout. Try refreshing or go back to the store.";
    });
  </script>
</body>
</html>
